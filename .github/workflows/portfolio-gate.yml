# Caller template. Copy to a public repository as .github/workflows/portfolio-gate.yml.
# Replace 5ac9b23bfea5780cfe1b6ad9eb2f1d8fe780b2c7 with the reviewed portfolio-governance commit SHA.
name: Portfolio Evidence Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  actions: read
  checks: write
  contents: write
  issues: write
  pull-requests: write
  security-events: read
  statuses: read

jobs:
  portfolio:
    uses: styayur/portfolio-governance/.github/workflows/reusable-portfolio-gate.yml@5ac9b23bfea5780cfe1b6ad9eb2f1d8fe780b2c7
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      central_sha: 5ac9b23bfea5780cfe1b6ad9eb2f1d8fe780b2c7
    secrets:
      PORTFOLIO_AI_REVIEW_API_KEY: ${{ secrets.PORTFOLIO_AI_REVIEW_API_KEY }}
