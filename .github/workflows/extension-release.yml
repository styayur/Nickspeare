name: Release browser extension

on:
  push:
    tags: ['extension-v*.*.*']

permissions:
  actions: read
  checks: read
  contents: write
  security-events: read

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chromium:
    name: Build, audit and verify ZIP in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Verify release identity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('extension/manifest.json').read_text())
          assert manifest['version'] == '0.1.1'
          assert manifest['version_name'] == '0.1.0-alpha.2'
          assert '${{ github.ref_name }}' == 'extension-v0.1.0-alpha.2'
          PY
      - run: npm ci
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - name: Node tests and core coverage
        shell: bash
        run: |
          mkdir -p artifacts
          npm run test:coverage | tee artifacts/node-coverage.txt
      - name: Python regression and package build
        shell: bash
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee artifacts/python-tests.txt
          python -m build
      - name: Pages regression
        shell: bash
        run: |
          python -m http.server 8765 --directory docs &
          server=$!
          trap 'kill "$server"' EXIT
          python -c "import urllib.request,time; time.sleep(2); urllib.request.urlopen('http://127.0.0.1:8765')"
          python scripts/check_browser.py | tee artifacts/pages-browser.txt
      - name: Build and audit extension
        run: |
          npm run build:extension:test
          npm run audit:extension
          python scripts/package_extension.py --release --expected-commit "$GITHUB_SHA"
      - name: Verify the ZIP in Chromium
        run: xvfb-run -a python scripts/test_extension.py --browser chromium --extension-root artifacts/extension-unpacked --test-extension-root dist/extension-test --output artifacts/extension-chromium.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: extension-chromium-evidence
          path: |
            artifacts/node-coverage.txt
            artifacts/python-tests.txt
            artifacts/pages-browser.txt
            artifacts/extension-audit.json
            artifacts/extension-package.json
            artifacts/extension-chromium.json
            artifacts/nickspeare-extension-chromium-v0.1.0-alpha.2.zip
            artifacts/screenshots

  edge:
    name: Verify ZIP in Microsoft Edge
    needs: chromium
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install playwright==1.63.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: extension-chromium-evidence
          path: chromium-evidence
      - name: Extract release ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -LiteralPath chromium-evidence -Filter 'nickspeare-extension-chromium-v0.1.0-alpha.2.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Release ZIP was not downloaded' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath artifacts/extension-unpacked -Force
      - run: npm run build:extension:test
      - name: Run actual Edge acceptance
        run: python scripts/test_extension.py --browser msedge --extension-root artifacts/extension-unpacked --test-extension-root dist/extension-test --output artifacts/extension-edge.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: extension-edge-evidence
          path: |
            artifacts/extension-edge.json
            artifacts/screenshots

  release:
    name: Publish pre-release
    needs: [chromium, edge]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect exact-commit evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_exact_checks.py --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --output artifacts/exact-checks.json --timeout 2400
      - name: Generate acceptance and release notes
        run: |
          python scripts/generate_extension_acceptance.py \
            --commit "$GITHUB_SHA" \
            --node-log artifacts/node-coverage.txt \
            --coverage-log artifacts/node-coverage.txt \
            --python-log artifacts/python-tests.txt \
            --pages-log artifacts/pages-browser.txt \
            --chromium artifacts/extension-chromium.json \
            --edge artifacts/extension-edge.json \
            --audit artifacts/extension-audit.json \
            --package artifacts/extension-package.json \
            --exact-checks artifacts/exact-checks.json \
            --governance-status PASS \
            --governance-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
          python scripts/render_release_notes.py
      - name: Verify release assets
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          acceptance = json.loads(Path('artifacts/extension-acceptance.json').read_text())
          assert acceptance['releaseReady'] is True, acceptance['blockers']
          assert acceptance['commit'] == '${{ github.sha }}'
          package = json.loads(Path('artifacts/extension-package.json').read_text())
          assert package['provenance']['dirty'] is False
          assert package['provenance']['commit'] == '${{ github.sha }}'
          PY
          cd artifacts
          sha256sum -c SHA256SUMS
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite." >&2
            exit 1
          fi
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # pinned reviewed release action
        with:
          tag_name: ${{ github.ref_name }}
          name: Nickspeare Browser Extension v0.1.0-alpha.2
          prerelease: true
          make_latest: false
          body_path: artifacts/release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/nickspeare-extension-chromium-v0.1.0-alpha.2.zip
            artifacts/SHA256SUMS
            artifacts/extension-acceptance.json
