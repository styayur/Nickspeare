[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nickspeare"
version = "1.1.0"
description = "Shakespearean nickname generator — from Eastcheap rogue to Agincourt king."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later AND CC-BY-NC-3.0"
license-files = ["LICENSE", "DATA_SOURCES.md"]
authors = [{ name = "styayur" }]
keywords = ["shakespeare", "nickname", "markov", "name-generator", "folger"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = ["build", "playwright"]

[project.urls]
Homepage = "https://styayur.github.io/Nickspeare/"
Repository = "https://github.com/styayur/Nickspeare"
Issues = "https://github.com/styayur/Nickspeare/issues"

[project.scripts]
nickspeare = "nickspeare.cli:main"

[tool.setuptools.packages.find]
include = ["nickspeare*"]

[tool.setuptools.package-data]
nickspeare = ["data/*.json", "data/features/*.json"]
